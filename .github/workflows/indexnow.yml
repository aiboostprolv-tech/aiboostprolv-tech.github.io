name: IndexNow ping

# Pēc katras izmaiņas mājaslapā paziņo Bing, Yandex u.c. meklētājiem (IndexNow),
# ka jāpārlasa mainītās lapas. Manuāli (Run workflow) var iesniegt visu sitemap.

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml']
  workflow_dispatch:

env:
  HOST: aiboostpro.lv
  KEY: cf7c3d1230af18c8250858f691e84810

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Collect URLs
        id: urls
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' > urls.txt
          else
            git diff --name-only HEAD^ HEAD -- '*.html' | grep -v '^_bot/' | grep -v '^404.html$' | while read -r f; do
              [ -f "$f" ] || continue
              p="${f%index.html}"
              echo "https://$HOST/$p"
            done > urls.txt
            if git diff --name-only HEAD^ HEAD | grep -qx 'sitemap.xml'; then
              grep -o '<loc>[^<]*' sitemap.xml | sed 's/<loc>//' >> urls.txt
            fi
          fi
          sort -u urls.txt -o urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          cat urls.txt
      - name: Wait for GitHub Pages deploy
        if: steps.urls.outputs.count != '0'
        run: sleep 120
      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          urls = [u.strip() for u in open("urls.txt") if u.strip()]
          body = json.dumps({"host": os.environ["HOST"], "key": os.environ["KEY"],
                             "keyLocation": f"https://{os.environ['HOST']}/{os.environ['KEY']}.txt",
                             "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow status:", r.status, "for", len(urls), "URLs")
          PY
